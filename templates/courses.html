<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXORA | Courses</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <h2>NEXORA</h2>
        <p class="side-subtitle">STUDENT PLATFORM</p>
        <a href="/dashboard">▦ Dashboard</a>
        <a href="/students">♙ Students</a>
        <a class="active" href="/courses">▤ Courses</a>
        <a href="/subjects">▧ Subjects</a>
        <button onclick="logoutUser()" class="logout-btn">↪ Logout</button>
    </aside>

    <main class="main-content">
        <header class="top-header">
            <h2>Course Management</h2>
            <span>NEXORA / Courses</span>
        </header>

        <section class="content-card">
            <div class="section-heading">
                <div>
                    <h1>Courses</h1>
                    <p>Manage available courses</p>
                </div>
                <button class="main-btn add-btn" onclick="openForm('courses')">+ Add Course</button>
            </div>

            <input class="search-box" id="coursesSearch"
                   placeholder="Search courses..." oninput="searchRecords('courses')">

            <div id="coursesForm" class="form-area hidden">
                <h3>Add Course</h3>
                <form onsubmit="saveRecord(event,'courses')">
                    <input id="coursesId" type="hidden">
                    <input id="coursesName" placeholder="Course name" required>
                    <input id="coursesDuration" placeholder="Duration (e.g. 4 Years)" required>
                    <input id="coursesDepartment" placeholder="Department" required>
                    <button class="main-btn">Save Course</button>
                    <button type="button" class="cancel-btn" onclick="closeForm('courses')">Cancel</button>
                </form>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Course Name</th><th>Duration</th>
                            <th>Department</th><th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="coursesTable"></tbody>
                </table>
            </div>
        </section>
    </main>
</div>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
