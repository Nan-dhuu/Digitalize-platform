<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXORA | Students</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <h2>NEXORA</h2>
        <p class="side-subtitle">STUDENT PLATFORM</p>
        <a href="/dashboard">▦ Dashboard</a>
        <a class="active" href="/students">♙ Students</a>
        <a href="/courses">▤ Courses</a>
        <a href="/subjects">▧ Subjects</a>
        <button onclick="logoutUser()" class="logout-btn">↪ Logout</button>
    </aside>

    <main class="main-content">
        <header class="top-header">
            <h2>Student Management</h2>
            <span>NEXORA / Students</span>
        </header>

        <section class="content-card">
            <div class="section-heading">
                <div>
                    <h1>Students</h1>
                    <p>Manage student records</p>
                </div>
                <button class="main-btn add-btn" onclick="openForm('students')">+ Add Student</button>
            </div>

            <input class="search-box" id="studentsSearch"
                   placeholder="Search students..." oninput="searchRecords('students')">

            <div id="studentsForm" class="form-area hidden">
                <h3>Add Student</h3>
                <form onsubmit="saveRecord(event,'students')">
                    <input id="studentsId" type="hidden">
                    <input id="studentsName" placeholder="Student name" required>
                    <input id="studentsEmail" type="email" placeholder="Email" required>
                    <input id="studentsPhone" placeholder="Phone number" required>
                    <input id="studentsCourse" placeholder="Course" required>
                    <button class="main-btn">Save Student</button>
                    <button type="button" class="cancel-btn" onclick="closeForm('students')">Cancel</button>
                </form>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th><th>Email</th><th>Phone</th>
                            <th>Course</th><th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="studentsTable"></tbody>
                </table>
            </div>
        </section>
    </main>
</div>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
